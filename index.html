<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Blink &amp; Glow HQ</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: collapsible sidebar + one working page per module; ivory ground, white cards, forest-green actions. */
:root{
  --bg:#F7F3EA;--surface:#FFFFFF;--soft:#EEE7D6;--line:#E0D7C1;--ink:#26292A;--mute:#667068;
  --green:#328566;--green-ink:#FFFFFF;--green-soft:#E3F1EA;--gold:#A8842C;
  --good:#1F7A55;--good-soft:#E1F0E7;--warn:#8F6200;--warn-soft:#FAEFD0;--bad:#A8323F;--bad-soft:#F8E1E4;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1814;--surface:#15241D;--soft:#1C3027;--line:#2A4237;--ink:#EDEBE3;--mute:#9FB0A5;
  --green:#6FC299;--green-ink:#0E1814;--green-soft:#1D3A2E;--gold:#D2B15B;
  --good:#6FC299;--good-soft:#1D3A2E;--warn:#E3B04B;--warn-soft:#3A2F12;--bad:#EE8591;--bad-soft:#40202A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1814;--surface:#15241D;--soft:#1C3027;--line:#2A4237;--ink:#EDEBE3;--mute:#9FB0A5;
  --green:#6FC299;--green-ink:#0E1814;--green-soft:#1D3A2E;--gold:#D2B15B;
  --good:#6FC299;--good-soft:#1D3A2E;--warn:#E3B04B;--warn-soft:#3A2F12;--bad:#EE8591;--bad-soft:#40202A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--serif);font-size:32px;line-height:1.1;letter-spacing:.2px}
h2{font-family:var(--serif);font-size:23px;line-height:1.15}
h3{font-size:14px}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.app.min{grid-template-columns:68px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px;gap:6px}
.logo{display:flex;gap:10px;align-items:center;padding:2px 6px 14px}
.logo i{font-style:normal;width:36px;height:36px;border:1.5px solid var(--green);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:17px;color:var(--green);flex:none}
.logo b{font-family:var(--serif);font-size:20px;line-height:1.05}
.logo small{display:block;color:var(--mute);font-size:11.5px;letter-spacing:.04em;font-family:var(--sans);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--mute);text-align:left;font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--green-soft);color:var(--green);font-weight:600}
.app.min .nav span,.app.min .logo b,.app.min .sidefoot{display:none}
.sidefoot{margin-top:auto;font-size:12px;color:var(--mute);padding:10px 6px 0}
.main{min-width:0;padding:0 clamp(16px,3vw,36px) 64px;padding-left:max(16px,clamp(16px,3vw,36px))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.topbar .grow{flex:1 1 200px;min-width:0}
.topbar .sub{color:var(--mute);font-size:13px}
.burger{display:none}
.btn{font-weight:600;border:1px solid var(--green);background:var(--green);color:var(--green-ink);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{padding:3px 10px;font-size:13px;font-weight:500}
.wrap{display:flex;flex-direction:column;gap:20px;max-width:1240px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card>h2{margin-bottom:2px}
.hint{color:var(--mute);font-size:13px;margin:2px 0 12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.tile .val{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .sub{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--mute)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.green{background:var(--green-soft);color:var(--green)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.act{white-space:nowrap;text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--mute);cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:26px 12px;border:1px dashed var(--line);border-radius:10px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.banner{border:1px solid var(--line);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner.info{background:var(--green-soft)}
.banner p{margin:0;flex:1 1 280px;min-width:0}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.03em}
.fgrid label.full{grid-column:1/-1}
.fgrid label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
.fgrid label.chk input{width:auto}
.fgrid small{font-weight:400;color:var(--mute);font-size:12px}
.err{color:var(--bad);font-size:13px;font-weight:500}
.ok{color:var(--good);font-size:13px;font-weight:500}
.ov{position:fixed;inset:0;background:rgba(14,24,20,.55);z-index:50;display:grid;place-items:start center;overflow-y:auto;padding:5vh 16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg.wide{width:min(860px,100%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--green-ink);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .r{display:grid;grid-template-columns:minmax(80px,140px) 1fr minmax(70px,auto);gap:10px;align-items:center;font-size:13px}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ins li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .d{min-height:88px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:11.5px;overflow:hidden;min-width:0}
.cal .d.off{opacity:.45}.cal .d.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.cal .hd{font-size:11px;font-weight:600;color:var(--mute);text-align:center}
.cal .it{display:block;width:100%;text-align:left;background:var(--green-soft);color:var(--green);border:0;border-radius:4px;padding:1px 4px;margin-top:2px;cursor:pointer;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .it.pub{background:var(--good-soft);color:var(--good)}
.slotgrid{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.slot[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.daypick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.daypick button{flex:none;min-width:64px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center}
.daypick button[disabled]{opacity:.4;cursor:default}
.daypick button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.daypick small{display:block;font-size:11px;opacity:.8}
.pubwrap{max-width:720px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.svc{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.svc[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
code.link{display:block;overflow-wrap:anywhere;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.skel{height:14px;background:var(--soft);border-radius:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
@media (max-width:860px){
  .app,.app.min{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-105%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(14,24,20,.45)}
  .app.min .nav span,.app.min .logo b,.app.min .sidefoot{display:inline}
  .burger{display:inline-block}
  .tile .val{font-size:27px}
  h1{font-size:27px}
  .cal .d{min-height:62px}
}
@media (max-width:700px){
  .tw{border:0;overflow:visible;display:flex;flex-direction:column;gap:10px}
  .tw table,.tw tbody{display:block}
  .tw thead{display:none}
  .tw tr{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
  .tw tr:last-child td{border-bottom:0}
  .tw tr.click:active td{background:transparent}
  .tw td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:5px 0;text-align:right}
  .tw td::before{content:attr(data-l);color:var(--mute);font-size:12px;font-weight:600;text-align:left;flex:none}
  .tw td:first-child{font-weight:600;font-size:15px;justify-content:flex-start;text-align:left;padding-bottom:6px}
  .tw td:first-child::before,.tw td[data-l=""]::before{display:none}
  .tw td[data-l=""]{justify-content:flex-start;flex-wrap:wrap;text-align:left}
  .tw td .act{display:flex;gap:8px;flex-wrap:wrap}
  .tw td[data-nil]{display:none}
  .tabs{flex-wrap:wrap;overflow:visible;gap:0}
  .tabs button{padding:8px 11px}
}

.aapp{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.ahead{display:flex;align-items:center;gap:10px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.atabs{display:flex;gap:2px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:57px;z-index:19}
.atabs button{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);font-weight:500;cursor:pointer;white-space:nowrap}
.atabs button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.atabs button[aria-current="page"]{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.amain{width:100%;max-width:1100px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:14px}
.amain h1{margin:0}
.bigacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bigacts .btn{padding:16px 12px;font-size:15px}
@media (max-width:700px){
  .atabs{position:fixed;top:auto;bottom:0;left:0;right:0;justify-content:space-around;padding:0 4px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-bottom:0;z-index:30;overflow:visible;gap:0}
  .atabs button{flex-direction:column;gap:2px;padding:8px 4px;font-size:11px;border-bottom:0;border-top:3px solid transparent;flex:1;min-width:0}
  .atabs button[aria-current="page"]{border-top-color:var(--green)}
  .amain{padding:16px 14px 96px}
  .ahead{padding:10px 14px}
  .ahead .logo b{white-space:nowrap;font-size:16px}
  .ahead .btn:not(:last-child){display:none}
  .bigacts{grid-template-columns:1fr 1fr}
}
</style>

</head>

<style>
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden]{display:none}
#gate form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
#gate h1{font-family:var(--serif);font-size:30px}
#gate p{margin:0;color:var(--mute);font-size:13px}
#gate label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}
#gate .lnk{border:0;background:none;color:var(--mute);text-decoration:underline;padding:0;font-size:12.5px;align-self:flex-start;cursor:pointer}
</style>
<div id="gate" hidden>
  <form id="gateForm" autocomplete="on" novalidate>
    <h1>Blink &amp; Glow HQ</h1>
    <p id="gateMsg">Sign in with the email and password you were given.</p>
    <label id="gEmailL">Email<input id="gEmail" type="email" autocomplete="username" required></label>
    <label id="gPassL">Password<input id="gPass" type="password" autocomplete="current-password" required></label>
    <label id="gPass2L" hidden>Repeat new password<input id="gPass2" type="password" autocomplete="new-password"></label>
    <div class="err" id="gErr" role="alert"></div>
    <button class="btn" id="gBtn" type="submit">Sign in</button>
    <button class="lnk" id="gForgot" type="button">Forgot your password?</button>
  </form>
</div>

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }

<script>
/* Blink & Glow HQ backend: Supabase. Gives the app the same small database interface it was built on,
   so the app code does not care where the data lives. Public keys only; security is row-level security + logins. */
(function(){
  const CFG=window.BGHQ_CONFIG||{};const TABLE='records';
  const $g=id=>document.getElementById(id);
  const gate=$g('gate'),form=$g('gateForm'),err=$g('gErr'),btn=$g('gBtn'),msg=$g('gateMsg');
  const h=location.hash||'';let mode=/type=(recovery|invite)/.test(h)?'setpw':'signin';
  const publicHash=()=>/^#book/.test(location.hash||'');
  // An emailed invite / reset link lands here with #...type=recovery (or invite). Remember it before the library
  // clears the address, so the person is always asked to choose a password and never dropped straight in without one.
  const LINK_ERR=/error_code=otp_expired|error=access_denied/.test(location.hash||'');
  const FROM_LINK=/[#&]type=(recovery|invite)\b/.test(location.hash||'');
  let resolveReady;const ready=new Promise(r=>{resolveReady=r});
  let sb=null;
  try{if(!CFG.url||/YOUR-PROJECT/.test(CFG.url))throw new Error('Supabase is not connected yet (edit config.js).');
    sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){console.error(e)}
  function show(m){mode=m;gate.hidden=false;err.textContent='';const setpw=m==='setpw',forgot=m==='forgot';
    $g('gEmailL').hidden=setpw;$g('gPassL').hidden=forgot;$g('gPass2L').hidden=!setpw;$g('gPass').autocomplete=setpw?'new-password':'current-password';
    $g('gForgot').textContent=forgot?'Back to sign in':'Forgot your password?';$g('gForgot').hidden=setpw;
    msg.textContent=setpw?'Choose a password for your account (at least 8 characters).':forgot?'Enter your email and we will send you a link to set a new password.':'Sign in with the email and password you were given.';
    btn.textContent=setpw?'Save password':forgot?'Send link':'Sign in';setTimeout(()=>{(setpw?$g('gPass'):$g('gEmail')).focus()},30)}
  function enter(session){gate.hidden=true;if(location.hash&&!publicHash())history.replaceState(null,'',location.pathname+location.search);resolveReady(session)}
  $g('gForgot').onclick=()=>show(mode==='forgot'?'signin':'forgot');
  form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';
    if(!sb){err.textContent='Could not reach the server. Check your internet and reload.';return}
    btn.disabled=true;
    try{
      if(mode==='signin'){const {data,error}=await sb.auth.signInWithPassword({email:$g('gEmail').value.trim(),password:$g('gPass').value});if(error)throw error;enter(data.session)}
      else if(mode==='forgot'){const {error}=await sb.auth.resetPasswordForEmail($g('gEmail').value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;msg.innerHTML='<span class="ok">Check your email for a link to set a new password.</span>'}
      else{const p=$g('gPass').value,p2=$g('gPass2').value;if(p.length<8)throw new Error('Use at least 8 characters.');if(p!==p2)throw new Error('The two passwords do not match.');
        const {error}=await sb.auth.updateUser({password:p});if(error)throw error;const {data}=await sb.auth.getSession();enter(data.session)}
    }catch(x){const m=(x&&x.message)||'Something went wrong';err.textContent=/invalid login/i.test(m)?'Wrong email or password.':m}finally{btn.disabled=false}});
  if(sb){
    sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')show('setpw')});
    sb.auth.getSession().then(({data})=>{
      if(data.session&&FROM_LINK&&mode!=='setpw')show('setpw');
      else if(data.session&&mode!=='setpw')enter(data.session);
      else if(data.session&&mode==='setpw')show('setpw');
      else if(publicHash()&&mode!=='setpw')resolveReady(null);
      else{const expired=mode==='setpw'||LINK_ERR;show('signin');if(expired)err.textContent='That link has expired or was already used. Tap "Forgot your password?" to get a fresh one, and open it straight away.'}
    }).catch(()=>show('signin'));
  }else{if(publicHash())resolveReady(null);else show('signin');err.textContent=CFG.url?'':'Supabase is not connected yet.'}

  const listeners={},cache={};
  const split=p=>{const a=String(p).split('/');return {c:a.slice(0,-1).join('/'),id:a[a.length-1]}};
  function snap(c){const m=cache[c]||new Map();return{docs:[...m.entries()].map(([id,data])=>({id,data:()=>data}))}}
  function emit(c){(listeners[c]||new Set()).forEach(l=>{try{l.cb(snap(c))}catch(e){console.error(e)}})}
  async function load(c){const m=new Map();let from=0;const step=1000;
    for(;;){const {data,error}=await sb.from(TABLE).select('id,data').eq('collection',c).order('id').range(from,from+step-1);
      if(error){(listeners[c]||new Set()).forEach(l=>l.err&&l.err(error));return}
      data.forEach(r=>m.set(r.id,r.data||{}));if(data.length<step)break;from+=step}
    cache[c]=m;emit(c)}
  let channel=null;
  function ensureChannel(){if(channel)return;
    channel=sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:TABLE},p=>{
      const row=p.eventType==='DELETE'?p.old:p.new;if(!row||!row.collection)return;const c=row.collection;if(!cache[c])return;
      if(p.eventType==='DELETE')cache[c].delete(row.id);else cache[c].set(row.id,row.data||{});emit(c)
    }).subscribe(status=>{if(status==='SUBSCRIBED'&&ensureChannel.was)Object.keys(listeners).forEach(load);if(status==='SUBSCRIBED')ensureChannel.was=true})}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&channel)Object.keys(listeners).forEach(load)});
  const EXPIRED='Your sign-in has expired. Sign out and sign in again, then repeat this.';
  async function guard(run){let r=await run();if(r.error&&(r.error.code==='42501'&&/permission denied for table/i.test(r.error.message||''))){try{await sb.auth.refreshSession()}catch(e){}r=await run();if(r.error&&r.error.code==='42501'&&/permission denied for table/i.test(r.error.message||''))throw new Error(EXPIRED)}return r}
  async function upsert(c,id,data){const clean=JSON.parse(JSON.stringify(data===undefined?{}:data));
    const {error}=await guard(()=>sb.from(TABLE).upsert({collection:c,id:String(id),data:clean},{onConflict:'collection,id'}));if(error)throw error;
    (cache[c]=cache[c]||new Map()).set(String(id),clean);emit(c)}
  function docRef(c,id){return{
    async set(d){await upsert(c,id,d)},
    async update(p){let cur=cache[c]&&cache[c].get(String(id));
      if(!cur){const {data,error}=await sb.from(TABLE).select('data').eq('collection',c).eq('id',String(id)).maybeSingle();if(error)throw error;if(!data)throw {code:'not_found',message:'Record not found'};cur=data.data||{}}
      const x=JSON.parse(JSON.stringify(p));const next=Object.assign({},cur);Object.keys(x).forEach(k=>{if(x[k]&&x[k].__delete__)delete next[k];else next[k]=x[k]});await upsert(c,id,next)},
    async delete(){const {error}=await guard(()=>sb.from(TABLE).delete().eq('collection',c).eq('id',String(id)));if(error)throw error;if(cache[c]){cache[c].delete(String(id));emit(c)}},
    onSnapshot(cb,errCb){const l={cb:s=>{const m=s.docs.find(d=>d.id===String(id));cb({exists:!!m,data:()=>m?m.data():undefined})},err:errCb};
      (listeners[c]=listeners[c]||new Set()).add(l);ensureChannel();if(cache[c])l.cb(snap(c));else load(c);return()=>listeners[c].delete(l)}}}
  const db={
    collection(c){return{doc:id=>docRef(c,id),onSnapshot(cb,errCb){const l={cb,err:errCb};(listeners[c]=listeners[c]||new Set()).add(l);ensureChannel();if(cache[c])cb(snap(c));else load(c);return()=>listeners[c].delete(l)}}},
    doc(p){const s=split(p);return docRef(s.c,s.id)}};
  const downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data],{type:/\.svg$/.test(filename)?'image/svg+xml':'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return {status:'saved'}}};
  window.claude={use:async name=>{if(name==='db'){await ready;return db}if(name==='downloads')return downloads;return null}};
  window.bghq={sb:sb,ready:ready,signOut:async()=>{try{await sb.auth.signOut()}catch(e){}location.href=location.pathname}};
})();

</script>

function overlap(a1,a2,b1,b2){return a1<b2&&b1<a2}

 for(let t=o;t+dur<=c;t+=step){
  if((cfg.breaks||[]).some(b=>overlap(t,t+dur,tmin(b.from),tmin(b.to))))continue;
  if((nowFn||minsFromNow)(date,t)<(cfg.notice||0)*60)continue;

  if(free.length)res.push({t:t,staff:free})}

  reindex();setTimeout(()=>syncPub(),3000);return}

 d.collection('slots').onSnapshot(s=>{D.slots=flatten('slots',s.docs);ready=true;sched()},err);

 d.doc(SETDOC).onSnapshot(s=>{if(s.exists){mergeS(s.data());if(!S.staff||!S.staff.length)S.staff=DEF.staff}sched()},()=>{});
 reindex();setTimeout(()=>{if(isAdmin)syncPub()},3000)}
